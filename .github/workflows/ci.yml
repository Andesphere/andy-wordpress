name: CI

on:
  push:
    branches: [main, 'feature/**', 'ticket/**']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Lint, package and Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.1 (the plugin's minimum)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Translations are in sync with the source
        run: |
          set -euo pipefail
          python3 bin/extract-strings.py
          python3 bin/translations-es.py
          git diff --exit-code -- languages

      - name: Build release ZIP
        run: bin/build-zip.sh

      - name: Unpack the ZIP exactly as WordPress would
        run: |
          set -euo pipefail
          mkdir -p package
          unzip -q dist/andy-chat.zip -d package
          test -f package/andy-chat/andy-chat.php
          test -f package/andy-chat/readme.txt
          test ! -e package/andy-chat/.github
          test ! -e package/andy-chat/bin

      - name: Plugin Check on the packaged plugin
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./package/andy-chat
          wp-version: '7.1'

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: andy-chat
          path: dist/andy-chat.zip
          if-no-files-found: error
