# Publishes a tagged version to the WordPress.org plugin directory (SVN).
#
# Trigger: a pushed tag vMAJOR.MINOR.PATCH whose number equals the plugin's Version header, the
# ANDY_CHAT_VERSION constant, the readme Stable tag and a readme changelog entry (bin/check-release-version.sh).
#
# This workflow cannot publish until the directory has approved the andy-chat slug and Jorge has stored
# the SVN credentials: bin/release-guard.sh fails the run unless the repository variable
# WPORG_DEPLOY_APPROVED is "true" and the secrets SVN_USERNAME and SVN_PASSWORD exist. Before that, pushing
# a version tag only builds, validates and uploads the ZIP; nothing reaches WordPress.org.
# The initial submission is manual (docs/release.md). No manual trigger exists on purpose.
name: Deploy to WordPress.org

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: wordpress-org-deploy
  cancel-in-progress: false

jobs:
  package:
    name: Build and validate the tagged package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag, plugin header, constant, stable tag and changelog agree
        id: version
        run: |
          set -euo pipefail
          version="$(bin/check-release-version.sh "$GITHUB_REF_NAME")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing andy-chat $version from tag $GITHUB_REF_NAME"

      - name: Set up PHP 8.1 (the plugin's minimum)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './dist/*' -print0 | xargs -0 -n1 php -l

      - name: Build release ZIP
        run: bin/build-zip.sh

      - name: Unpack the ZIP exactly as WordPress would
        run: |
          set -euo pipefail
          mkdir -p package
          unzip -q dist/andy-chat.zip -d package
          test -f package/andy-chat/andy-chat.php
          test -f package/andy-chat/readme.txt
          test ! -e package/andy-chat/.github
          test ! -e package/andy-chat/bin
          test ! -e package/andy-chat/docs
          bin/check-release-version.sh "$GITHUB_REF_NAME" >/dev/null
          sha256sum dist/andy-chat.zip

      - name: Plugin Check on the packaged plugin
        uses: WordPress/plugin-check-action@v1
        with:
          build-dir: ./package/andy-chat
          wp-version: '7.1'

      - name: Upload the validated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: andy-chat-${{ steps.version.outputs.version }}
          path: dist/andy-chat.zip
          if-no-files-found: error

  deploy:
    name: Commit the validated package to WordPress.org SVN
    needs: package
    runs-on: ubuntu-latest
    # The environment is where Jorge stores SVN_USERNAME and SVN_PASSWORD; it may also carry a required
    # reviewer so every publication gets a human click. GitHub creates it on first use.
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v4

      - name: Release guard (directory approval and credentials)
        env:
          WPORG_DEPLOY_APPROVED: ${{ vars.WPORG_DEPLOY_APPROVED }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: bin/release-guard.sh

      - name: Download the ZIP that Plugin Check validated
        uses: actions/download-artifact@v4
        with:
          name: andy-chat-${{ needs.package.outputs.version }}
          path: dist

      - name: Unpack it as the deploy source
        run: |
          set -euo pipefail
          mkdir -p package
          unzip -q dist/andy-chat.zip -d package
          test -f package/andy-chat/andy-chat.php
          bin/check-release-version.sh "$GITHUB_REF_NAME" >/dev/null

      # BUILD_DIR makes the action deploy exactly the unpacked ZIP contents; .distignore is not consulted
      # again. The tag name minus its "v" becomes the SVN tag, so tags/0.1.0 matches "Stable tag: 0.1.0".
      # No .wordpress-org directory exists, so no listing assets are pushed.
      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: andy-chat
          BUILD_DIR: package/andy-chat
